[project]
name = "chronos-randbats"
version = "0.1.0"
description = "Project Chronos: Autonomous Pokémon Showdown Gen 9 Random Battles Engine and Training Pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jax",
    "jaxlib",
    "flax",
    "optax",
    "poke-env",
    "kaggle",
    "huggingface_hub",
    "requests",
    "numpy",
    "scipy",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
